# 배포 서버(EC2) 전용 오버라이드
#
# 사용: SPRING_PROFILES_ACTIVE=prod java -jar build/libs/*.jar
#
# 호스트·포트·시크릿 같은 "값"은 .env에 두고, 이 파일에는
# 환경에 따라 달라지는 "동작"만 둔다.
#
# 주의: 프로파일을 지정하지 않으면 SecurityConfig의 isDev가 true가 되어
#       Swagger UI(/swagger-ui/**, /v3/api-docs/**)가 공개된다.
#       배포 시 이 프로파일 활성화는 선택이 아니라 필수.
#
#       단 /auth.html은 앱이 회원가입·로그인 WebView로 여는 화면이라
#       프로파일과 무관하게 항상 공개된다.

spring:
  jpa:
    hibernate:
      # 기본값 update — 운영 중 엔티티 변경이 스키마에 자동 반영되는 것을 막는다.
      #
      # 최초 기동 시 스키마가 없으면 검증 실패로 기동이 중단된다.
      # 빈 DB로 시작하는 경우 한 번만 update로 띄워 스키마를 만든 뒤 되돌릴 것.
      # 로컬 DB 덤프를 복원해 쓰는 경우에는 그대로 두면 된다.
      ddl-auto: validate
    # SQL 로그에 등록·검증 데이터가 남지 않도록 차단
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# 허용할 오리진을 쉼표로 구분해 .env의 CORS_ALLOWED_ORIGINS에 지정한다.
#   예) https://verify.example.com,chrome-extension://abcdefghijklmnop
#
# 비워두면 SecurityConfig가 개발 모드로 간주해 모든 오리진을 허용하므로
# 배포 환경에서는 반드시 값을 채울 것.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    com.jinbon: INFO
    org.hibernate.SQL: WARN
